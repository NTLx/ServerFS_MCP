[package]
name = "serverfs-windows-native"
version = "0.10.0-dev"
edition = "2021"
rust-version = "1.85"
description = "ServerFS Windows native filesystem kernel (v0.10 Phase B)"
license = "MIT"

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"], optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lib]
name = "serverfs_windows_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
pyo3 = ["dep:pyo3"]
