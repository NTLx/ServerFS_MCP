[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# The Windows native kernel ships as its own wheel (dev_plan §24.2):
# serverfs-mcp stays a pure Python product package and is never converted
# to a maturin build. End users install this prebuilt wheel and need no
# Rust, Cargo, MSVC Build Tools or Windows SDK.

[project]
name = "serverfs-windows-native"
dynamic = ["version"]
description = "ServerFS Windows native filesystem kernel (handle-capable read/mutation engine)"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Private :: Do Not Upload",
]

# The version is owned by Cargo.toml; declaring it dynamic lets Maturin
# source it from Cargo metadata without duplicating release state.

[tool.maturin]
features = ["pyo3"]
module-name = "serverfs_windows_native"
strip = true
