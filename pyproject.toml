[project]
name = "serverfs-mcp"
version = "0.4.0"
description = "A secure MCP server that exposes explicitly configured Linux directories as controlled workdirs to AI agents, read-only by default with opt-in per-workdir file mutation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "NTLx" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serverfs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.coverage.run]
source = ["serverfs_mcp"]
