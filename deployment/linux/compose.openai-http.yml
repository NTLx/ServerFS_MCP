# Linux v0.25.0 direct HTTP OpenAI connector. Select with --profile openai-http.
# The connector has its own process and only depends on the Core's readiness.
services:
  openai-tunnel:
    profiles: ["openai-http"]
    # Reuse the base proxy launcher; it forwards these explicit HTTP arguments.
    command:
      - --control-plane.tunnel-id
      - ${CONTROL_PLANE_TUNNEL_ID:?Set CONTROL_PLANE_TUNNEL_ID}
      - --control-plane.api-key
      - file:/run/secrets/openai-control-plane-key
      - --mcp.server-url
      - url=http://serverfs-mcp:${SERVERFS_HTTP_PORT:-8000}${SERVERFS_HTTP_PATH:-/mcp}
      - --mcp.extra-headers
      - "Authorization: file:/run/secrets/serverfs-core-bearer"
      - --mcp.discovery-extra-headers
      - "Authorization: file:/run/secrets/serverfs-core-bearer"
      - --health.listen-addr
      - 127.0.0.1:8080
    environment:
      MCP_SERVER_URL: ""
      CONTROL_PLANE_API_KEY: ""
      HEALTH_LISTEN_ADDR: "127.0.0.1:8080"
    healthcheck:
      test: ["CMD", "/usr/bin/tunnel-client", "health", "--port", "8080", "--require-control-plane-poll"]
    volumes:
      - type: bind
        source: ${OPENAI_CONTROL_PLANE_KEY_FILE:?Set an absolute external OpenAI key file path}
        target: /run/secrets/openai-control-plane-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVERFS_CORE_BEARER_FILE:?Set an absolute external Core bearer file path}
        target: /run/secrets/serverfs-core-bearer
        read_only: true
        bind:
          create_host_path: false
