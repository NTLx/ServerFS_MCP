# Select only for host-published HTTP, alongside compose.http.yml.
# Docker may omit port mappings when every attached network is internal.
# Keep the existing private connector networks; add a per-project ingress
# bridge only when the operator has explicitly selected host publication.
services:
  serverfs-mcp:
    networks:
      - serverfs_internal
      - serverfs_file_ingress
      - serverfs_http_ingress

networks:
  serverfs_http_ingress:
    driver: bridge
    internal: false
