name: Integration candidate gates

# Validate the exact integration push SHA, not a synthetic PR merge commit.
# Reuse the release gates without creating tags, publishing images or deploying Pages.
on:
  push:
    branches:
      - integration/v0.27.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gate:
    name: Linux / Container gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  linux-systemd-rollback:
    name: Linux historical Bridge systemd rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate and historical Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true

      - name: Sync isolated Bridge dependencies
        working-directory: linux/agent_bridge
        run: uv sync --frozen

      - name: Require clean hosted runner user manager
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          # This is a disposable GitHub-hosted VM, not an installed ServerFS host.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          unset DBUS_SESSION_BUS_ADDRESS
          if ! systemctl --user show --property=Version >/dev/null 2>&1; then
            sudo systemctl start "user@$(id -u).service"
          fi
          systemctl --user show --property=Version
          # Do not replace or shadow any existing ServerFS template or unit.
          # List the full inventory first: a pattern with no matches may exit nonzero.
          # Preserve query errors via pipefail, and do not confuse them with empty matches.
          templates="$(systemctl --user list-unit-files --no-legend --no-pager)"
          units="$(systemctl --user list-units --all --plain --no-legend --no-pager)"
          conflicts="$(printf '%s\n' "$templates" "$units" | awk '$1 ~ /^serverfs-agent-bridge/ {print $1}')"
          if [ -n "$conflicts" ]; then
            printf 'Existing ServerFS units or templates:\n%s\n' "$conflicts" >&2
            exit 1
          fi
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Historical installed Bridge upgrade and rollback under systemd
        shell: bash
        run: |
          set -euo pipefail
          unset DBUS_SESSION_BUS_ADDRESS
          linux/agent_bridge/.venv/bin/python -I -B deployment/native/check_linux_upgrade.py --systemd --online

      - name: Historical installed Bridge upgrade and rollback using shipped persistent template
        shell: bash
        run: |
          set -euo pipefail
          unset DBUS_SESSION_BUS_ADDRESS
          linux/agent_bridge/.venv/bin/python -I -B deployment/native/check_linux_upgrade.py --persistent-systemd --online

  linux-docker-rollback:
    name: Linux historical Docker Core rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and historical Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true

      - name: Sync Linux test controller
        working-directory: linux
        run: uv sync --frozen

      - name: Verify historical and candidate installed Docker images with shared workspace
        working-directory: linux
        shell: bash
        env:
          SERVERFS_LINUX_DOCKER_ROLLBACK: "1"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/linux-docker-rollback.xml"
          .venv/bin/python -B -m pytest -q -rs -s -o addopts='' \
            tests/test_linux_v27_docker_core_rollback.py --junitxml="$report"
          .venv/bin/python -I -B - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          assert len(cases) == 1
          assert cases[0].get("name") == "test_historical_docker_core_upgrade_and_rollback"
          assert all(cases[0].find(k) is None for k in ("failure", "error", "skipped"))
          PY

  windows-native-gate:
    name: Windows Native gate
    uses: ./.github/workflows/windows-native.yml

  windows-agent-gate:
    name: Windows Agent gate
    uses: ./.github/workflows/windows-agent.yml

  windows-scheduler-rollback:
    name: Windows Scheduler environment and rollback gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and historical Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true

      - name: Sync test controller dependencies
        working-directory: windows
        run: uv sync --frozen

      - name: Validate runner account and execute applicable Scheduler acceptance
        working-directory: windows
        shell: pwsh
        env:
          SERVERFS_WINDOWS_SCHEDULER_ROLLBACK: "1"
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-scheduler-rollback.xml"
          $sid = & .venv/Scripts/python.exe -I -B -c "from serverfs_mcp.native_endpoint import current_user_sid; print(current_user_sid())"
          if ($LASTEXITCODE -ne 0 -or $sid -isnot [string] -or $sid -notmatch '^S-1-\d+(?:-\d+)+$') {
            throw "Runner SID cannot be verified"
          }
          $file = "tests/test_windows_v27_scheduler_core_rollback.py"
          $case = "test_historical_file_only_core_scheduler_upgrade_and_rollback"
          $coverage = "Historical Windows Scheduler rollback executed"
          if ($sid.EndsWith("-500")) {
            $file = "tests/test_windows_v27_scheduler_hosted_identity.py"
            $case = "test_hosted_builtin_admin_refuses_private_owner"
            $coverage = "Hosted built-in Administrator ACL refusal only; actual rollback NOT EXECUTED. Separate ordinary-user native evidence required for release."
          }
          .venv/Scripts/python.exe -B -m pytest -q -rs -o addopts='' "${file}::${case}" "--junitxml=$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$xml = Get-Content -Raw -LiteralPath $report
          $cases = @($xml.SelectNodes("//testcase"))
          if ($cases.Count -ne 1 -or $cases[0].GetAttribute("name") -ne $case) {
            throw "Unexpected Scheduler acceptance case"
          }
          if ($cases[0].SelectSingleNode("failure|error|skipped")) {
            throw "Required applicable Scheduler acceptance did not pass"
          }
          Write-Output $coverage
          $coverage | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  macos-gate:
    name: macOS Native gate
    uses: ./.github/workflows/macos-native.yml

  pages-gate:
    name: Documentation site gate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      deploy_pages: false
