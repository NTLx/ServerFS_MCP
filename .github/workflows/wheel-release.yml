name: Release

# v0.23.3+ stable publication is deliberately dispatch-first rather than tag-first.
# The exact main SHA must pass every reusable release gate before this workflow may
# create the lightweight tag. Wheels, Plugin, GitHub Release and stable GHCR tags are
# downstream of that tag creation. A red gate therefore cannot become a published
# stable release merely because a maintainer pushed a tag too early.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Validate tag, versions and current main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Stable releases must be dispatched from main" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          }
          test -f "docs/releases/$RELEASE_TAG.md" || {
            echo "Missing release notes: docs/releases/$RELEASE_TAG.md" >&2
            exit 1
          }
          uv run --no-project --python 3.12 python - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          expected = tag[1:]
          root = pathlib.Path('.')
          versions = {
              'root': tomllib.loads((root / 'pyproject.toml').read_text())['project']['version'],
              'bridge': tomllib.loads((root / 'agent_bridge/pyproject.toml').read_text())['project']['version'],
              'windows-native': tomllib.loads((root / 'native/windows/Cargo.toml').read_text())['package']['version'],
              'plugin': json.loads((root / 'plugin.json').read_text())['version'],
              'registry': json.loads((root / 'server.json').read_text())['version'],
          }
          bad = {name: version for name, version in versions.items() if version != expected}
          if bad:
              raise SystemExit(f'release version mismatch: expected {expected}, got {bad}')
          print('release version surfaces:', versions)
          PY
          git fetch --prune origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "origin/main does not equal the dispatched candidate SHA" >&2
            exit 1
          }
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "Existing remote tag points to another commit" >&2
            exit 1
          fi

  linux-gate:
    name: Linux / Container gate
    needs: prepare
    uses: ./.github/workflows/container.yml

  windows-native-gate:
    name: Windows Native gate
    needs: prepare
    uses: ./.github/workflows/windows-native.yml

  windows-agent-gate:
    name: Windows Agent gate
    needs: prepare
    uses: ./.github/workflows/windows-agent.yml

  macos-gate:
    name: macOS Native gate
    needs: prepare
    uses: ./.github/workflows/macos-native.yml

  pages-gate:
    name: Documentation site gate
    needs: prepare
    uses: ./.github/workflows/pages.yml
    with:
      deploy_pages: false

  create-tag:
    name: Create immutable release tag
    needs:
      - prepare
      - linux-gate
      - windows-native-gate
      - windows-agent-gate
      - macos-gate
      - pages-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare-and-create lightweight tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --prune origin main --tags
          head="$(git rev-parse HEAD)"
          remote_main="$(git rev-parse origin/main)"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "main advanced or candidate SHA changed while release gates were running" >&2
            exit 1
          fi

          ref="refs/tags/$RELEASE_TAG"
          remote_tag="$(git ls-remote origin "$ref" | awk '{print $1}')"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "Remote release tag conflict" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "$ref"; then
            test "$(git rev-parse "$ref^{commit}")" = "$GITHUB_SHA" || {
              echo "Local release tag conflict" >&2
              exit 1
            }
          else
            git update-ref "$ref" "$GITHUB_SHA" "0000000000000000000000000000000000000000"
          fi

          if [ -z "$remote_tag" ]; then
            git push --porcelain --no-verify origin "$GITHUB_SHA:$ref"
          fi
          verified="$(git ls-remote origin "$ref" | awk '{print $1}')"
          test "$verified" = "$GITHUB_SHA" || {
            echo "Remote release tag verification failed" >&2
            exit 1
          }

  wheel:
    name: Publish wheels, Plugin and GitHub Release
    needs: create-tag
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: build release wheels (maturin native + hatchling product + hatchling Agent Bridge)
        run: |
          uv tool run --from maturin==1.8.2 maturin build --release --features pyo3 --locked -m native/windows/Cargo.toml
          uv build --wheel -o dist
          uv build --wheel -o ../dist --directory agent_bridge
        shell: pwsh

      - name: all three wheel versions must match the tag (METADATA is authoritative)
        run: |
          $native = (Get-ChildItem native/windows/target/wheels/*.whl).FullName
          $product = (Get-ChildItem dist/serverfs_mcp-*.whl).FullName
          $bridge = (Get-ChildItem dist/serverfs_agent_bridge-*.whl).FullName
          uv run --no-project --python 3.12 python deployment/native/wheel_release.py version-gate `
            --tag "${{ inputs.release_tag }}" --wheel $native --wheel $product --wheel $bridge
        shell: pwsh

      - name: validate and build ServerFS Agent Plugin release ZIP
        run: |
          uv run --no-project --python 3.12 python deployment/plugin/package_plugin.py build `
            --output-dir dist `
            --tag "${{ inputs.release_tag }}"
        shell: pwsh

      - name: three-wheel clean-install acceptance across the frozen two-interpreter boundary
        run: |
          $native = (Get-ChildItem native/windows/target/wheels/*.whl).FullName
          $product = (Get-ChildItem dist/serverfs_mcp-*.whl).FullName
          $bridge = (Get-ChildItem dist/serverfs_agent_bridge-*.whl).FullName
          # Two isolated environments, matching the frozen ServerFS/Agent-Bridge process
          # boundary: the wheels never share one dependency graph (root freezes mcp==2.2.0,
          # the Bridge's frozen Qoder SDK declares mcp<2.0.0), and the supervisor selects the
          # Bridge interpreter through SERVERFS_BRIDGE_PYTHON.
          uv venv --python 3.12 .venv-serverfs
          $serverfsPy = ".venv-serverfs/Scripts/python.exe"
          uv pip install --python $serverfsPy $native $product pytest
          uv venv --python 3.12 .venv-bridge
          $bridgePy = ".venv-bridge/Scripts/python.exe"
          uv pip install --python $bridgePy $bridge
          if (Test-Path Env:PYTHONPATH) { Remove-Item Env:PYTHONPATH }
          # Packaging gate, run from a temp cwd outside the checkout: each environment proves
          # it carries exactly its own side of the frozen boundary -- neither may be able to
          # import the other package, and versions must match the tag.
          $probe = Join-Path $env:RUNNER_TEMP "wheel-acceptance-probe.py"
          Set-Content -Encoding utf8NoBOM $probe @'
          import importlib.metadata as md
          from importlib.util import find_spec
          import sys

          side = sys.argv[1]
          if side == "serverfs":
              import serverfs_mcp, serverfs_windows_native as native
              assert find_spec("serverfs_agent_bridge") is None, "product env must not contain the Bridge package"
              locs = [serverfs_mcp.__file__, native.__file__]
              assert all(".venv-serverfs" in x.replace(chr(92), "/").lower() for x in locs), locs
              versions = {n: md.version(n) for n in ("serverfs-mcp", "serverfs-windows-native")}
          elif side == "bridge":
              import serverfs_agent_bridge
              assert find_spec("serverfs_mcp") is None, "bridge env must not contain the product package"
              assert find_spec("serverfs_windows_native") is None, "bridge env must not contain the native package"
              locs = [serverfs_agent_bridge.__file__]
              assert all(".venv-bridge" in x.replace(chr(92), "/").lower() for x in locs), locs
              versions = {"serverfs-agent-bridge": md.version("serverfs-agent-bridge"),
                          "qoder-agent-sdk": md.version("qoder-agent-sdk"),
                          "claude-agent-sdk": md.version("claude-agent-sdk")}
          else:
              raise SystemExit(f"unknown side {side!r}")
          print(f"{side} env provenance ok:", *locs, sep=" ")
          print(f"{side} env versions:", versions, sep=" ")
          '@
          & $serverfsPy $probe serverfs
          & $bridgePy $probe bridge
          .venv-serverfs/Scripts/serverfs.exe --version
          # Cross-environment product evidence: the real supervisor chain with
          # SERVERFS_BRIDGE_PYTHON pointing at the Bridge clean venv, and the product CLI
          # served by the ServerFS clean venv. The runner has no Codex state at all: the
          # D9 chain renders a Codex-enabled config whose default codex_home only needs
          # to exist for validation (measured on the first v0.11.0 tag run and retained as the compatibility baseline).
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE/.codex" | Out-Null
          $env:SERVERFS_BRIDGE_PYTHON = (Resolve-Path $bridgePy).Path
          $env:SERVERFS_TEST_ROOT_PYTHON = (Resolve-Path $serverfsPy).Path
          & $serverfsPy -m pytest tests/test_native_windows.py tests/test_windows_backend.py tests/test_windows_mcp_e2e.py tests/test_windows_service.py tests/test_doctor.py tests/test_tunnel_bootstrap.py tests/test_d9_native_lifecycle.py -q
        shell: pwsh

      - name: attach release artifacts to the tag's GitHub Release, preserving notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT: ${{ github.sha }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          $native = Get-ChildItem native/windows/target/wheels/*.whl
          $product = Get-ChildItem dist/serverfs_mcp-*.whl
          $bridge = Get-ChildItem dist/serverfs_agent_bridge-*.whl
          $plugin = Get-ChildItem dist/serverfs-plugin-v*.zip
          if (-not (gh release view $tag 2>$null)) {
            $notesFile = "docs/releases/$tag.md"
            if (Test-Path -LiteralPath $notesFile -PathType Leaf) {
              gh release create $tag --target $env:COMMIT --verify-tag --title "ServerFS $tag" --notes-file $notesFile
            } else {
              gh release create $tag --target $env:COMMIT --verify-tag --title "ServerFS $tag" --notes "ServerFS $tag"
            }
          }
          gh release upload $tag $native.FullName --clobber
          gh release upload $tag $product.FullName --clobber
          gh release upload $tag $bridge.FullName --clobber
          gh release upload $tag $plugin.FullName --clobber
          $pluginHash = (Get-FileHash $plugin.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "ServerFS Agent Plugin: $($plugin.Name) sha256=$pluginHash"
          $nativeHash = (Get-FileHash $native.FullName -Algorithm SHA256).Hash.ToLower()
          $productHash = (Get-FileHash $product.FullName -Algorithm SHA256).Hash.ToLower()
          $bridgeHash = (Get-FileHash $bridge.FullName -Algorithm SHA256).Hash.ToLower()
          $nativeUrl = "$env:SERVER_URL/$env:REPO/releases/download/$tag/$($native.Name)"
          $productUrl = "$env:SERVER_URL/$env:REPO/releases/download/$tag/$($product.Name)"
          $bridgeUrl = "$env:SERVER_URL/$env:REPO/releases/download/$tag/$($bridge.Name)"
          (gh release view $tag --json body --jq '.body') -join "`n" |
            Set-Content -Encoding utf8NoBOM release-body-in.md
          uv run --no-project --python 3.12 python deployment/native/wheel_release.py notes-update `
            --body-file release-body-in.md --out-file release-notes-out.md `
            --product-name $product.Name --product-url $productUrl --product-sha $productHash `
            --bridge-name $bridge.Name --bridge-url $bridgeUrl --bridge-sha $bridgeHash `
            --native-name $native.Name --native-url $nativeUrl --native-sha $nativeHash
          if ($LASTEXITCODE -ne 0) {
            Write-Error "notes-update failed closed; release body left untouched"
            exit $LASTEXITCODE
          }
          gh release edit $tag --notes-file release-notes-out.md
        shell: pwsh

  container-release:
    name: Publish stable container
    needs: wheel
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-publish.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  verify-publication:
    name: Verify stable publication
    needs:
      - wheel
      - container-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify immutable tag and exact GitHub Release asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ref_sha="$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$ref_sha" = "$GITHUB_SHA" || {
            echo "Published tag does not point to the gated release SHA" >&2
            exit 1
          }

          release_json="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" '
            .tag_name == $tag
            and .target_commitish == $sha
            and .draft == false
            and .prerelease == false
          ' <<<"$release_json" >/dev/null

          version="${RELEASE_TAG#v}"
          expected="$(printf '%s\n' \
            "serverfs_agent_bridge-$version-py3-none-any.whl" \
            "serverfs-plugin-v$version.zip" \
            "serverfs_mcp-$version-py3-none-any.whl" \
            "serverfs_windows_native-$version-cp312-abi3-win_amd64.whl" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected GitHub Release asset set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR for verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify stable GHCR tags resolve to one dual-architecture OCI index
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE: ghcr.io/ntlx/serverfs_mcp
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          expected_hash=""
          for label in "$version" "$minor" latest; do
            raw="$(docker buildx imagetools inspect "$IMAGE:$label" --raw)"
            printf '%s' "$raw" | jq -e '
              [.manifests[]
               | select(.platform.os == "linux")
               | .platform.architecture] as $arch
              | (($arch | index("amd64")) != null)
                and
                (($arch | index("arm64")) != null)
            ' >/dev/null
            hash="$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
            if [ -z "$expected_hash" ]; then
              expected_hash="$hash"
            else
              test "$hash" = "$expected_hash" || {
                echo "Stable GHCR tags do not resolve to the same OCI index" >&2
                exit 1
              }
            fi
          done
