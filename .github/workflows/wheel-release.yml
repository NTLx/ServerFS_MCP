name: Windows wheel release

# dev_plan_v0.10.md §24.2/§30: publication channel for the prebuilt release
# wheels. Runs only when the maintainer creates a release tag. Both release
# artifacts are built first and gated against the tag version (Cargo owns
# the native version, pyproject owns the product version). Acceptance then
# installs the TWO WHEELS ONLY into a clean venv -- no editable checkout, no
# PYTHONPATH -- proving the release artifacts themselves serve as the sole
# providers of the package and native module. Both wheels are then attached
# to the tag's GitHub Release; the wheel section in the release body is
# regenerated in place under a management marker, preserving any notes the
# maintainer wrote. The "Private :: Do Not Upload" trove classifier in
# native/windows/pyproject.toml remains a PyPI guard: this workflow does not
# publish to any package index.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: build release wheels (maturin native + hatchling product)
        run: |
          uv tool run --from maturin==1.8.2 maturin build --release --features pyo3 --locked -m native/windows/Cargo.toml
          uv build --wheel -o dist
        shell: pwsh

      - name: both wheel versions must match the tag (Cargo and pyproject own them)
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v').Split('+')[0]
          $accepted = @($tag, ($tag -replace '-', ''))
          foreach ($wheel in @((Get-ChildItem native/windows/target/wheels/*.whl), (Get-ChildItem dist/*.whl))) {
            $ver = ($wheel.Name -split '-')[2]
            if ($accepted -notcontains $ver) {
              Write-Error "wheel $($wheel.Name) version $ver does not match tag $tag; the Cargo version (native) and the project version (pyproject) must equal the tag before releasing"
              exit 1
            }
            "version gate ok: $($wheel.Name)"
          }
        shell: pwsh

      - name: two-wheel clean-install acceptance (no editable checkout)
        run: |
          $native = (Get-ChildItem native/windows/target/wheels/*.whl).FullName
          $product = (Get-ChildItem dist/*.whl).FullName
          uv venv --python 3.12 .venv-release
          $py = ".venv-release/Scripts/python.exe"
          uv pip install --python $py $native $product pytest
          if (Test-Path Env:PYTHONPATH) { Remove-Item Env:PYTHONPATH }
          & $py -c "import serverfs_mcp, serverfs_windows_native as n; locs=[serverfs_mcp.__file__, n.__file__]; assert all('.venv-release' in x.replace(chr(92),'/').lower() for x in locs), locs; print('wheel-only provenance ok:', *locs, sep=' ')"
          .venv-release/Scripts/serverfs.exe --version
          & $py -m pytest tests/test_native_windows.py tests/test_windows_backend.py tests/test_windows_mcp_e2e.py tests/test_doctor.py tests/test_tunnel_bootstrap.py -q
        shell: pwsh

      - name: attach wheels to the tag's GitHub Release, preserving notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT: ${{ github.sha }}
        run: |
          $tag = "${{ github.ref_name }}"
          $native = Get-ChildItem native/windows/target/wheels/*.whl
          $product = Get-ChildItem dist/*.whl
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --target $env:COMMIT --verify-tag --title "ServerFS $tag" --notes "ServerFS $tag"
          }
          gh release upload $tag $native.FullName --clobber
          gh release upload $tag $product.FullName --clobber
          $nativeHash = (Get-FileHash $native.FullName -Algorithm SHA256).Hash.ToLower()
          $productHash = (Get-FileHash $product.FullName -Algorithm SHA256).Hash.ToLower()
          $nativeUrl = "$env:SERVER_URL/$env:REPO/releases/download/$tag/$($native.Name)"
          $productUrl = "$env:SERVER_URL/$env:REPO/releases/download/$tag/$($product.Name)"
          $marker = "<!-- serverfs-windows-wheel-assets -->"
          $section = @"
          $marker

          ## Windows native installation assets (Python >= 3.12; no Rust/MSVC/Docker required)

          | file | sha256 |
          | --- | --- |
          | [$($product.Name)]($productUrl) | ``$productHash`` |
          | [$($native.Name)]($nativeUrl) | ``$nativeHash`` |

          Clean install:
            uv venv --python 3.12
            uv pip install $productUrl $nativeUrl

          Verified native-wheel storage alternative:
            serverfs bootstrap native-wheel --url "$nativeUrl" --sha256 $nativeHash
          "@
          $existing = (gh release view $tag --json body --jq '.body') 2>$null
          $existing = ($existing -join "`n")
          if ($existing.Contains($marker)) {
            $head = ($existing -split [regex]::Escape($marker))[0]
            $notes = ($head.TrimEnd() + "`n`n" + $section)
          } else {
            $notes = ($existing.TrimEnd() + "`n`n" + $section).TrimStart()
          }
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release edit $tag --notes-file release-notes.md
        shell: pwsh
