name: Pages

on:
  workflow_call:
    inputs:
      deploy_pages:
        description: Deploy the built site; release gates leave this false
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
      - integration/v0.27.0
      - feat/v0.27.0-platform-split
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the built site after validation
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Write PR preview provenance
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/v0.27.0')
        working-directory: site
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = {
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "pr_head_sha": os.environ["PR_HEAD_SHA"],
              "pr_base_sha": os.environ["PR_BASE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          with Path("dist/provenance.json").open("w", encoding="utf-8") as output:
              json.dump(manifest, output, sort_keys=True)
              output.write("\n")
          PYCODE

      - name: Retain PR preview for offline browser acceptance
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/v0.27.0')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview-${{ github.sha }}
          path: site/dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy site
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
