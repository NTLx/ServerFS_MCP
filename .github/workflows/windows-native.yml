name: Windows native

# dev_plan_v0.10.md §30 "Windows Python/native gate", executed on every
# push/PR that touches the Windows kernel or the platform-boundary Python
# layers. The release-blocking wheel-artifact run (maturin) belongs to
# Phase E packaging; this gate builds the extension with cargo and
# imports the produced .pyd directly.

on:
  workflow_call:

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "src/serverfs_mcp/backends.py"
      - "src/serverfs_mcp/linux_backend.py"
      - "src/serverfs_mcp/windows_backend.py"
      - "src/serverfs_mcp/windows_*.py"
      - "src/serverfs_mcp/agent_lifecycle.py"
      - "src/serverfs_mcp/paths.py"
      - "src/serverfs_mcp/tools.py"
      - "src/serverfs_mcp/cli.py"
      - "src/serverfs_mcp/cloudflare_bootstrap.py"
      - "src/serverfs_mcp/config.py"
      - "src/serverfs_mcp/main.py"
      - "src/serverfs_mcp/http_auth.py"
      - "src/serverfs_mcp/auth_config.py"
      - "src/serverfs_mcp/file_ingress.py"
      - "src/serverfs_mcp/native_config.py"
      - "src/serverfs_mcp/native_tunnel.py"
      - "src/serverfs_mcp/shared_proxy.py"
      - "src/serverfs_mcp/doctor.py"
      - "src/serverfs_mcp/tunnel_bootstrap.py"
      - "src/serverfs_mcp/supervisor.py"
      - "pyproject.toml"
      - "src/serverfs_mcp/search_glob.py"
      - "tests/test_cli.py"
      - "tests/test_cloudflare_bootstrap.py"
      - "tests/test_native_http.py"
      - "tests/test_native_tunnel.py"
      - "tests/test_doctor.py"
      - "tests/test_tunnel_bootstrap.py"
      - "tests/test_windows_*"
      - "tests/test_search_glob*"
      - "tests/test_search_find_contract.py"
      - "tests/test_native_windows.py"
      - "tests/test_import_safety.py"
      - "tests/test_auth_config.py"
      - "tests/test_file_ingress.py"
      - "tests/test_http_auth.py"
      - "tests/test_api_key_e2e.py"
      - "tests/test_oauth_e2e.py"
      - "tests/test_darwin_backend.py"
      - "tests/test_darwin_service.py"
      - "tests/test_darwin_bridge_policy.py"
      - ".github/workflows/windows-native.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "src/serverfs_mcp/backends.py"
      - "src/serverfs_mcp/linux_backend.py"
      - "src/serverfs_mcp/windows_backend.py"
      - "src/serverfs_mcp/windows_*.py"
      - "src/serverfs_mcp/agent_lifecycle.py"
      - "src/serverfs_mcp/paths.py"
      - "src/serverfs_mcp/tools.py"
      - "src/serverfs_mcp/cli.py"
      - "src/serverfs_mcp/cloudflare_bootstrap.py"
      - "src/serverfs_mcp/config.py"
      - "src/serverfs_mcp/main.py"
      - "src/serverfs_mcp/http_auth.py"
      - "src/serverfs_mcp/auth_config.py"
      - "src/serverfs_mcp/file_ingress.py"
      - "src/serverfs_mcp/native_config.py"
      - "src/serverfs_mcp/native_tunnel.py"
      - "src/serverfs_mcp/shared_proxy.py"
      - "src/serverfs_mcp/doctor.py"
      - "src/serverfs_mcp/tunnel_bootstrap.py"
      - "src/serverfs_mcp/supervisor.py"
      - "pyproject.toml"
      - "src/serverfs_mcp/search_glob.py"
      - "tests/test_cli.py"
      - "tests/test_cloudflare_bootstrap.py"
      - "tests/test_native_http.py"
      - "tests/test_native_tunnel.py"
      - "tests/test_doctor.py"
      - "tests/test_tunnel_bootstrap.py"
      - "tests/test_windows_*"
      - "tests/test_search_glob*"
      - "tests/test_search_find_contract.py"
      - "tests/test_native_windows.py"
      - "tests/test_import_safety.py"
      - "tests/test_auth_config.py"
      - "tests/test_file_ingress.py"
      - "tests/test_http_auth.py"
      - "tests/test_api_key_e2e.py"
      - "tests/test_oauth_e2e.py"
      - "tests/test_darwin_backend.py"
      - "tests/test_darwin_service.py"
      - "tests/test_darwin_bridge_policy.py"
      - ".github/workflows/windows-native.yml"

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-kernel:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # the acceptance job must EXECUTE the symlink-class reparse cases;
      # a soft skip is a failure here (tests/ntfs_traversal.rs honors it)
      SERVERFS_REQUIRE_SYMLINK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (runner-provided, versions reported for evidence)
        run: |
          rustc --version
          cargo --version
        shell: pwsh

      - name: cargo fmt
        working-directory: native/windows
        run: cargo fmt --check
        shell: pwsh

      - name: cargo clippy (lib + integration, -D warnings)
        working-directory: native/windows
        run: cargo clippy --locked --all-targets -- -D warnings
        shell: pwsh

      - name: cargo clippy (python feature, -D warnings)
        working-directory: native/windows
        run: cargo clippy --locked --all-targets --features pyo3 -- -D warnings
        shell: pwsh

      - name: cargo test (kernel; symlink cases hard-required)
        working-directory: native/windows
        run: cargo test --locked
        shell: pwsh

      - name: mutation metadata-fixture evidence (disclose fixture branch taken)
        working-directory: native/windows
        run: >
          cargo test --locked --test ntfs_mutation -- --nocapture --test-threads=1
          extended_attributes object_id_fail
        shell: pwsh

      - name: cargo test (python-boundary unit tests)
        working-directory: native/windows
        run: cargo test --locked --features pyo3
        shell: pwsh

      - name: Build release extension module
        working-directory: native/windows
        run: |
          cargo build --locked --release --features pyo3
          New-Item -ItemType Directory -Force -Path pyd-staging | Out-Null
          Copy-Item target/release/serverfs_windows_native.dll pyd-staging/serverfs_windows_native.pyd -Force
        shell: pwsh

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check + format gate
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Cross-platform pytest collection gate
        env:
          PYTHONPATH: "${{ github.workspace }}\\native\\windows\\pyd-staging"
        run: uv run pytest --collect-only -q

      - name: Windows Python/native test set
        env:
          PYTHONPATH: "${{ github.workspace }}\\native\\windows\\pyd-staging"
        run: >
          uv run pytest
          tests/test_import_safety.py
          tests/test_auth_config.py
          tests/test_file_ingress.py
          tests/test_http_auth.py
          tests/test_api_key_e2e.py
          tests/test_oauth_e2e.py
          tests/test_native_windows.py
          tests/test_windows_backend.py
          tests/test_windows_mcp_e2e.py
          tests/test_windows_native_stdio.py
          tests/test_windows_path_acceptance.py
          tests/test_cli.py
          tests/test_native_tunnel.py
          tests/test_windows_service.py
          tests/test_windows_cloudflare_config.py
          tests/test_windows_cloudflare_runtime.py
          tests/test_windows_cloudflare_security.py
          tests/test_windows_cloudflare_acl_native.py
          tests/test_windows_cloudflare_service.py
          tests/test_windows_cloudflare_isolated_http.py
          tests/test_cloudflare_bootstrap.py
          tests/test_native_http.py
          tests/test_doctor.py
          tests/test_tunnel_bootstrap.py
          tests/test_paths.py
          tests/test_config.py
          tests/test_workdirs.py -q

      # dev_plan §30: "Release CI must additionally test the wheel as an
      # artifact rather than only testing an in-tree debug build." The wheel
      # is built with maturin (abi3-py312, Cargo owns the version), then
      # installed into a CLEAN uv venv together with the project. No
      # PYTHONPATH and no pyd-staging: only the wheel provides the native
      # module, proving end users get a usable backend from the wheel alone.
      - name: maturin wheel build (release, abi3, locked)
        working-directory: native/windows
        run: uv tool run --from maturin==1.8.2 maturin build --release --features pyo3 --locked
        shell: pwsh

      - name: wheel artifact acceptance (clean env, no PYTHONPATH)
        run: |
          $wheel = (Get-ChildItem native/windows/target/wheels/*.whl).FullName
          uv venv --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/Scripts/python.exe $wheel pytest
          uv pip install --python .venv-wheel/Scripts/python.exe -e .
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          .venv-wheel/Scripts/python.exe -m pytest tests/test_native_windows.py tests/test_windows_backend.py tests/test_windows_mcp_e2e.py tests/test_windows_service.py tests/test_windows_cloudflare_config.py tests/test_windows_cloudflare_runtime.py tests/test_windows_cloudflare_security.py tests/test_windows_cloudflare_acl_native.py tests/test_windows_cloudflare_service.py tests/test_windows_cloudflare_isolated_http.py tests/test_cloudflare_bootstrap.py tests/test_native_http.py -q
        shell: pwsh

      # Separate from the staged Python mocks: a real GitHub-hosted Windows
      # runner must verify the pinned official executable and its signer.
      # No machine service, account key, Tunnel Token or public DNS is used.
      - name: Official Windows cloudflared binary integrity and signer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'serverfs-v0242-cloudflared-authenticity'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $binary = Join-Path $folder 'cloudflared.exe'
          $url = 'https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-windows-amd64.exe'
          try {
            Invoke-WebRequest -Uri $url -OutFile $binary -MaximumRedirection 5
          } catch {
            throw 'Pinned official Windows cloudflared download failed'
          }
          $digest = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '2493dbc168923bb3e59e5e7716f71deced92992eea9acd6e9d74f84ac7751343') {
            throw 'Pinned official Windows cloudflared SHA256 mismatch'
          }
          Write-Output 'OFFICIAL_SHA256_MATCH=True'
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          Write-Output "AUTHENTICODE_STATUS=$($signature.Status)"
          $subject = if ($null -ne $signature.SignerCertificate) {
            $signature.SignerCertificate.Subject
          } else {
            '(none)'
          }
          Write-Output "AUTHENTICODE_SIGNER=$subject"
          if ($signature.Status -ne 'Valid' -or $subject -notmatch '^CN=(?:"Cloudflare, Inc\."|Cloudflare, Inc\.|Cloudflare Inc\.)(?:,|$)') {
            throw 'Official Windows cloudflared Authenticode signer gate failed'
          }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch '2026\.10\.7') {
            throw 'Pinned Windows cloudflared version check failed'
          }
          Write-Output 'OFFICIAL_SIGNATURE_AND_VERSION_VALID=True'
          # Exercise the actual ServerFS bootstrap verifier on the same
          # official SHA-matched executable, not only the workflow's guard.
          $env:SERVERFS_CLOUDFLARED_GATE_FILE = $binary
          uv run python -c "import os; from pathlib import Path; from serverfs_mcp.cloudflare_bootstrap import _verify_windows_binary; _verify_windows_binary(Path(os.environ['SERVERFS_CLOUDFLARED_GATE_FILE']))"
          if ($LASTEXITCODE -ne 0) { throw 'ServerFS Windows cloudflared verifier rejected official signed asset' }
          Write-Output 'SERVERFS_WINDOWS_SIGNER_VERIFIER_VALID=True'

      - name: upload native wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serverfs-windows-native-wheel
          path: native/windows/target/wheels/*.whl
          if-no-files-found: error
