name: macOS Native

# v0.13 macOS gate: Apple M-series, native arm64, macOS 27 Golden Gate
# ONLY (dev_plan_v0.13.md §16; v0.13.2 adds the SMAppService companion).
# There is no x86_64 matrix, no macOS 26
# matrix, no Intel compatibility and no Rosetta CI. The platform
# assertions at the start of every job are authoritative — runner
# labels are never trusted on their own. If hosted infrastructure
# cannot satisfy them, run this workflow on an M-series self-hosted
# runner with the same assertions.

# Runner selection: jobs default to GitHub's hosted `xcode-27` public-preview
# label for native arm64 macOS 27. If hosted capacity is unavailable, register
# an M-series
# self-hosted runner (e.g. with the label `macos27-arm64`) and set the
# repository Actions variable MACOS_RUNNER=macos27-arm64 — every job below
# switches to it without any other change. The in-job platform assertions
# remain authoritative either way.

on:
  workflow_call:

  push:
    branches:
      - main
      - feat/v0.27.0-platform-split
      - feat/v0.27.0-macos
    paths:
      - "macos/**"
      - "contracts/**"
      - "deployment/native/wheel_release.py"
      - "deployment/native/check_mcp_contract.py"
      - "deployment/native/platform_isolation.py"
      - "docs/diagnostics/v0270-capture-v026-contract.py"
      - ".github/workflows/macos-native.yml"
  pull_request:
    branches:
      - main
      - feat/v0.27.0-platform-split
      - integration/v0.27.0
    paths:
      - "macos/**"
      - "contracts/**"
      - "deployment/native/wheel_release.py"
      - "deployment/native/check_mcp_contract.py"
      - "deployment/native/platform_isolation.py"
      - "docs/diagnostics/v0270-capture-v026-contract.py"
      - ".github/workflows/macos-native.yml"

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-assert:
    name: Assert macOS 27 arm64 native
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - name: Measure the platform
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m)"
          echo "macOS:     $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "kernel:    $(uname -r)"
          test "$(uname -m)" = "arm64" || { echo "FAIL: not arm64"; exit 1; }
          MAJOR="$(sw_vers -productVersion | cut -d. -f1)"
          test "$MAJOR" = "27" || { echo "FAIL: macOS major is $MAJOR, need 27"; exit 1; }
          TRANSLATED="$(sysctl -n sysctl.proc_translated)"
          test "$TRANSLATED" = "0" || { echo "FAIL: Rosetta-translated process"; exit 1; }
          echo "platform assertions passed: native arm64 macOS 27, not Rosetta"

  test:
    defaults:
      run:
        working-directory: macos
    name: MCP suite (macOS 27 arm64)
    needs: platform-assert
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - name: Assert the platform again inside the job
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "27"
          test "$(sysctl -n sysctl.proc_translated)" = "0"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify the test interpreter is native arm64
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -c "import platform, sys; assert platform.machine() == 'arm64', platform.machine(); assert sys.platform == 'darwin'"
          file "$(.venv/bin/python -c 'import sys; print(sys.executable)')" | grep -q arm64

      - name: Build and verify the macOS Service Manager companion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/serverfs-service-manager-ci
          bash native/macos/service_manager/build.sh /tmp/serverfs-service-manager-ci
          test -x /tmp/serverfs-service-manager-ci/ServerFSServiceManager.app/Contents/MacOS/serverfs-service-manager
          test -x /tmp/serverfs-service-manager-ci/ServerFSServiceManager.app/Contents/Resources/serverfs-service-launcher

      - name: Verify wheel carries the Service Manager build sources
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/serverfs-macos-core-wheels"
          uv build --wheel --out-dir "$dist"
          version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-project --python 3.12 python ../deployment/native/wheel_release.py version-gate \
            --tag "v$version" --platform macos --wheel "$dist"/serverfs_mcp-*.whl
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'serverfs-macos-core-wheels').glob('serverfs_mcp-*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          required = {
              'serverfs_mcp/_darwin_service_manager/build.sh',
              'serverfs_mcp/_darwin_service_manager/Info.plist',
              'serverfs_mcp/_darwin_service_manager/Sources/ServiceManager/main.swift',
              'serverfs_mcp/_darwin_service_manager/Sources/ServiceLauncher/main.swift',
              'serverfs_mcp/_darwin_service_manager/LaunchAgents/com.ntlx.serverfs.tunnel.plist',
              'serverfs_mcp/_darwin_service_manager/LaunchAgents/com.ntlx.serverfs.bridge.plist',
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          assert not missing, missing
          PY

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Compare frozen v0.26.0 MCP contract
        run: uv run --frozen python -I -B ../deployment/native/check_mcp_contract.py ..

      - name: Verify standalone platform source and installed wheels
        run: uv run --frozen python -I -B ../deployment/native/platform_isolation.py . --online

      - name: Whitespace check
        run: git diff --check

      - name: Retain verified macOS Core wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-core-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/serverfs-macos-core-wheels/*.whl
          if-no-files-found: error

  bridge-test:
    name: Agent Bridge suite (macOS 27 arm64)
    needs: platform-assert
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    defaults:
      run:
        working-directory: macos/agent_bridge
    steps:
      - name: Assert the platform again inside the job
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "27"
          test "$(sysctl -n sysctl.proc_translated)" = "0"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Build and verify platform-local Bridge wheel
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/serverfs-macos-bridge-wheels"
          uv build --wheel --out-dir "$dist"
          version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-project --python 3.12 python ../../deployment/native/wheel_release.py version-gate \
            --tag "v$version" --platform macos --wheel "$dist"/serverfs_agent_bridge-*.whl

      # Real SMAppService registration/reboot/login acceptance is local and operator-scoped;
      # hosted CI covers the lifecycle adapter and Bridge suites without mutating Login Items.
      - name: Test
        run: uv run pytest

      - name: Retain verified macOS Bridge wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bridge-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/serverfs-macos-bridge-wheels/*.whl
          if-no-files-found: error
