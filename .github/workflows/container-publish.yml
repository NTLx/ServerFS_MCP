name: Container publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable tag to publish; empty publishes main as edge
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ntlx/serverfs_mcp

jobs:
  publish:
    name: Publish container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve immutable publication tags
        id: refs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            printf 'tags<<EOF\n%s:edge\nEOF\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "Release tag does not point to the validated workflow SHA" >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:$version"
            echo "$IMAGE_NAME:$minor"
            echo "$IMAGE_NAME:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.refs.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ServerFS MCP
            org.opencontainers.image.description=Secure read-only MCP access to explicitly configured Linux server workdirs
            org.opencontainers.image.source=https://github.com/NTLx/ServerFS_MCP
            org.opencontainers.image.url=https://github.com/NTLx/ServerFS_MCP
            org.opencontainers.image.documentation=https://github.com/NTLx/ServerFS_MCP#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=serverfs-mcp
          cache-to: type=gha,scope=serverfs-mcp,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify image manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --raw |
            jq -e '
              [.manifests[]
               | select(.platform.os == "linux")
               | .platform.architecture] as $arch
              | (($arch | index("amd64")) != null)
                and
                (($arch | index("arm64")) != null)
            '
