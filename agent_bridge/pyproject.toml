[project]
name = "serverfs-agent-bridge"
version = "0.7.1"
description = "Host-side Agent Bridge for ServerFS MCP."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.156",
    "typesafe-sdk==0.7.1",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
serverfs-agent-bridge = "serverfs_agent_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serverfs_agent_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
