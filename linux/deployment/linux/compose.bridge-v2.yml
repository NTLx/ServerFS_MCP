# Explicit opt-in signed-v2 attachment for one independently configured host Bridge.
# The owner must provision all host paths and the private binding before rendering.
services:
  serverfs-mcp:
    user: "${SERVERFS_UID:?Set the host Bridge owner UID}:${SERVERFS_GID:?Set the host Bridge owner GID}"
    environment:
      SERVERFS_AGENT_BRIDGE_ENABLED: "true"
      SERVERFS_LINUX_V25_BRIDGE_BINDING_FILE: /run/serverfs-core-bridge-binding/core-bridge-binding.json
      SERVERFS_LINUX_INSTANCE_ID: ${SERVERFS_LINUX_INSTANCE_ID:?Set a non-default SERVERFS_LINUX_INSTANCE_ID}
      SERVERFS_LINUX_BRIDGE_ID: ${SERVERFS_LINUX_BRIDGE_ID:?Set SERVERFS_LINUX_BRIDGE_ID}
      SERVERFS_AGENT_BRIDGE_SOCKET: /run/serverfs-agent-bridge/bridge.sock
      SERVERFS_AGENT_LOCK_DIR: /run/serverfs-agent-locks
      SERVERFS_AGENT_MODE: ${SERVERFS_AGENT_MODE:-disabled}
      SERVERFS_AGENT_RUNTIMES: ${SERVERFS_AGENT_RUNTIMES:-}
      WORKDIR_01_AGENT_MODE: ${WORKDIR_01_AGENT_MODE:-disabled}
      WORKDIR_01_AGENT_RUNTIMES: ${WORKDIR_01_AGENT_RUNTIMES:-}
      WORKDIR_01_REPO_OPS_ENABLED: ${WORKDIR_01_REPO_OPS_ENABLED:-false}
      WORKDIR_02_AGENT_MODE: ${WORKDIR_02_AGENT_MODE:-disabled}
      WORKDIR_02_AGENT_RUNTIMES: ${WORKDIR_02_AGENT_RUNTIMES:-}
      WORKDIR_02_REPO_OPS_ENABLED: ${WORKDIR_02_REPO_OPS_ENABLED:-false}
      WORKDIR_03_AGENT_MODE: ${WORKDIR_03_AGENT_MODE:-disabled}
      WORKDIR_03_AGENT_RUNTIMES: ${WORKDIR_03_AGENT_RUNTIMES:-}
      WORKDIR_03_REPO_OPS_ENABLED: ${WORKDIR_03_REPO_OPS_ENABLED:-false}
      WORKDIR_04_AGENT_MODE: ${WORKDIR_04_AGENT_MODE:-disabled}
      WORKDIR_04_AGENT_RUNTIMES: ${WORKDIR_04_AGENT_RUNTIMES:-}
      WORKDIR_04_REPO_OPS_ENABLED: ${WORKDIR_04_REPO_OPS_ENABLED:-false}
      WORKDIR_05_AGENT_MODE: ${WORKDIR_05_AGENT_MODE:-disabled}
      WORKDIR_05_AGENT_RUNTIMES: ${WORKDIR_05_AGENT_RUNTIMES:-}
      WORKDIR_05_REPO_OPS_ENABLED: ${WORKDIR_05_REPO_OPS_ENABLED:-false}
      WORKDIR_06_AGENT_MODE: ${WORKDIR_06_AGENT_MODE:-disabled}
      WORKDIR_06_AGENT_RUNTIMES: ${WORKDIR_06_AGENT_RUNTIMES:-}
      WORKDIR_06_REPO_OPS_ENABLED: ${WORKDIR_06_REPO_OPS_ENABLED:-false}
      WORKDIR_07_AGENT_MODE: ${WORKDIR_07_AGENT_MODE:-disabled}
      WORKDIR_07_AGENT_RUNTIMES: ${WORKDIR_07_AGENT_RUNTIMES:-}
      WORKDIR_07_REPO_OPS_ENABLED: ${WORKDIR_07_REPO_OPS_ENABLED:-false}
      WORKDIR_08_AGENT_MODE: ${WORKDIR_08_AGENT_MODE:-disabled}
      WORKDIR_08_AGENT_RUNTIMES: ${WORKDIR_08_AGENT_RUNTIMES:-}
      WORKDIR_08_REPO_OPS_ENABLED: ${WORKDIR_08_REPO_OPS_ENABLED:-false}
      WORKDIR_09_AGENT_MODE: ${WORKDIR_09_AGENT_MODE:-disabled}
      WORKDIR_09_AGENT_RUNTIMES: ${WORKDIR_09_AGENT_RUNTIMES:-}
      WORKDIR_09_REPO_OPS_ENABLED: ${WORKDIR_09_REPO_OPS_ENABLED:-false}
      WORKDIR_10_AGENT_MODE: ${WORKDIR_10_AGENT_MODE:-disabled}
      WORKDIR_10_AGENT_RUNTIMES: ${WORKDIR_10_AGENT_RUNTIMES:-}
      WORKDIR_10_REPO_OPS_ENABLED: ${WORKDIR_10_REPO_OPS_ENABLED:-false}
      WORKDIR_11_AGENT_MODE: ${WORKDIR_11_AGENT_MODE:-disabled}
      WORKDIR_11_AGENT_RUNTIMES: ${WORKDIR_11_AGENT_RUNTIMES:-}
      WORKDIR_11_REPO_OPS_ENABLED: ${WORKDIR_11_REPO_OPS_ENABLED:-false}
      WORKDIR_12_AGENT_MODE: ${WORKDIR_12_AGENT_MODE:-disabled}
      WORKDIR_12_AGENT_RUNTIMES: ${WORKDIR_12_AGENT_RUNTIMES:-}
      WORKDIR_12_REPO_OPS_ENABLED: ${WORKDIR_12_REPO_OPS_ENABLED:-false}
      WORKDIR_13_AGENT_MODE: ${WORKDIR_13_AGENT_MODE:-disabled}
      WORKDIR_13_AGENT_RUNTIMES: ${WORKDIR_13_AGENT_RUNTIMES:-}
      WORKDIR_13_REPO_OPS_ENABLED: ${WORKDIR_13_REPO_OPS_ENABLED:-false}
      WORKDIR_14_AGENT_MODE: ${WORKDIR_14_AGENT_MODE:-disabled}
      WORKDIR_14_AGENT_RUNTIMES: ${WORKDIR_14_AGENT_RUNTIMES:-}
      WORKDIR_14_REPO_OPS_ENABLED: ${WORKDIR_14_REPO_OPS_ENABLED:-false}
      WORKDIR_15_AGENT_MODE: ${WORKDIR_15_AGENT_MODE:-disabled}
      WORKDIR_15_AGENT_RUNTIMES: ${WORKDIR_15_AGENT_RUNTIMES:-}
      WORKDIR_15_REPO_OPS_ENABLED: ${WORKDIR_15_REPO_OPS_ENABLED:-false}
      WORKDIR_16_AGENT_MODE: ${WORKDIR_16_AGENT_MODE:-disabled}
      WORKDIR_16_AGENT_RUNTIMES: ${WORKDIR_16_AGENT_RUNTIMES:-}
      WORKDIR_16_REPO_OPS_ENABLED: ${WORKDIR_16_REPO_OPS_ENABLED:-false}
    volumes:
      - type: bind
        source: ${SERVERFS_LINUX_BRIDGE_SOCKET_DIR:?Set the dedicated host Bridge socket directory}
        target: /run/serverfs-agent-bridge
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVERFS_LINUX_BRIDGE_LOCK_DIR:?Set the dedicated host Bridge lock directory}
        target: /run/serverfs-agent-locks
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVERFS_LINUX_CORE_BINDING_DIR:?Set the private owner-provisioned binding directory}
        target: /run/serverfs-core-bridge-binding
        read_only: true
        bind:
          create_host_path: false
